_target_: jepa.JEPA
num_flow_steps: ${num_flow_steps}
flow_source: ${flow_matching.source}
flow_source_noise_scale: ${flow_matching.source_noise_scale}
freeze_encoder: false
freeze_projector: false

encoder:
  _target_: stable_pretraining.backbone.utils.vit_hf
  size: tiny
  patch_size: 14
  image_size: ${img_size}
  pretrained: false
  use_mask_token: false

predictor:
  _target_: module.FlowTrajectoryPredictor
  input_dim: ${embed_dim}
  hidden_dim: ${embed_dim}
  action_dim: ${embed_dim}
  output_dim: ${embed_dim}
  output_proj_hidden_dim: 768
  causal_self_attention: false
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

action_encoder:
  _target_: module.Embedder
  input_dim: ???
  emb_dim: ${embed_dim}

projector:
  _target_: module.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true

pred_proj: null
